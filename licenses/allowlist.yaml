#
# Правила (проверяются scripts/check-code-licenses.py):
#   * component — ровно "name==version", не диапазон;
#   * license   — SPDX-выражение или точное имя лицензии из метаданных пакета;
#   * reason    — почему исключение допустимо (линковка, отсутствие поставки…);
#   * scope     — runtime | build | dev | research; research НЕ покрывает
#                 пользовательскую сборку;
#   * expires_at — ISO-дата, не дальше 12 месяцев; без неё гейт падает;
#   * issue     — ссылка на тикет, который снимет исключение.


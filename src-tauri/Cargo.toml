[package]
name = "kadr"
version = "0.1.0"
description = "Kadr — локальный каталогизатор медиаархива (Tauri 2 shell)"
edition = "2021"

[lib]
name = "kadr_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = "2"
base64 = "0.22"
tauri-plugin-dialog = "2.8.4"
tauri-plugin-opener = "2.7.3"
tauri-plugin-updater = "2.14.1"

[features]
custom-protocol = ["tauri/custom-protocol"]

[target."cfg(windows)".dependencies]
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_Security"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kadr"
version = "0.1.0b0"
description = "Kadr — локальный раскладчик и каталогизатор медиаархива (MIAS research track)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Denis Klubnikin" }]
keywords = ["media", "catalog", "photos", "privacy", "offline", "mias"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Multimedia :: Graphics",
  "Topic :: System :: Filesystems",
]
dependencies = [
  "PyYAML>=5.4",
]

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn>=0.27", "python-multipart>=0.0.9"]
images = ["Pillow>=10.0"]
hashing = ["blake3>=0.4"]
ml = ["onnxruntime>=1.17", "numpy>=1.24"]
dev = [
  "pytest>=8.0",
  "httpx>=0.27",
  "exifread>=3.0",
  "ffmpeg-python>=0.2",
  "fastapi>=0.110",
  "uvicorn>=0.27",
  "python-multipart>=0.0.9",
  "Pillow>=10.0",
  "blake3>=0.4",
  "ruff>=0.4",
  "mypy>=1.8",
]
all = [
  "fastapi>=0.110",
  "uvicorn>=0.27",
  "python-multipart>=0.0.9",
  "Pillow>=10.0",
  "blake3>=0.4",
  "onnxruntime>=1.17",
  "numpy>=1.24",
]

[project.scripts]
kadr = "kadr.cli:main"

[project.urls]
Documentation = "https://github.com/klubnikindd/multimodal-ai-attack-surface"
Source = "https://github.com/klubnikindd/multimodal-ai-attack-surface"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["kadr*", "attack_surface*"]

[tool.setuptools.package-data]
kadr = ["catalog/*.sql", "data/*.json", "data/*.yaml", "static/*.html", "static/*.js", "static/*.css"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "security: security regression corpus",
  "slow: slow benchmarks",
  "network: tests that require network access (never in default run)",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
warn_unused_ignores = true
ignore_missing_imports = true

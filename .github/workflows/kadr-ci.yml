name: Kadr CI

permissions:
  contents: read

concurrency:
  group: kadr-ci-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
  push:
    branches: [main]

jobs:
  preflight:
    name: preflight (required scripts)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ensure helper scripts exist
        shell: bash
        run: |
          for f in scripts/check-model-license.py scripts/check-model-integrity.py \
                   scripts/sqlite_vec_smoke.py scripts/check-sidecar-lifecycle.py \
                   scripts/check-no-onefile.py scripts/check-sandbox-parity.py; do
            test -f "$f" || { echo "missing $f"; exit 1; }
          done

  tests:
    needs: preflight
    name: tests (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,api]"
      - name: Test
        run: pytest -q

  license-weights:
    needs: preflight
    name: license-weights
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pyyaml
      - name: Validate models/manifest.yaml
        run: python scripts/check-model-license.py --json

  model-integrity:
    needs: preflight
    name: model-integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pyyaml
      - name: Manifest integrity
        run: python scripts/check-model-integrity.py

  sqlite-vec-smoke:
    needs: preflight
    name: sqlite-vec-smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pyyaml sqlite-vec
      - name: KNN smoke
        run: python scripts/sqlite_vec_smoke.py

  sidecar-lifecycle:
    needs: preflight
    name: sidecar-lifecycle (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pyyaml
      - name: No orphans on shutdown
        run: python scripts/check-sidecar-lifecycle.py

  packaging:
    needs: preflight
    name: packaging (no one-file)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/check-no-onefile.py
